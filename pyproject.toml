[project]
name = "image-platform"
version = "0.1.0"
description = "Data platform for ingesting, processing, and serving image/clip data products"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "pillow>=10.0",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/image_platform"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts", "lambdas"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
