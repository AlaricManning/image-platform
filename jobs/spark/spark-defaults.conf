# Spark config for the local-mode runner container. Identical Iceberg/Glue
# catalog settings to what EMR Serverless will use (there they're passed as
# sparkSubmitParameters instead).
spark.sql.extensions                        org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.glue                      org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.glue.catalog-impl         org.apache.iceberg.aws.glue.GlueCatalog
spark.sql.catalog.glue.io-impl              org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.glue.warehouse            s3://imgp-dev-silver-935961368629/warehouse/
spark.hadoop.fs.s3.impl                     org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider com.amazonaws.auth.DefaultAWSCredentialsProviderChain
spark.driver.memory                         12g
spark.sql.shuffle.partitions                8
